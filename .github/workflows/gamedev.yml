name: Game Dev foundation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/gamedev-foundation, feature/gamedev-execution]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gamedev-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      # The upstream Linux systemd mount name contains literal backslashes, so
      # Windows cannot materialize that one file. Every other file in
      # deploy/systemd is needed: the application reads the renderer's timer
      # while it starts, and a checkout without it cannot start at all.
      - name: Allow upstream paths in the Windows index
        if: runner.os == 'Windows'
        run: git config --global core.protectNTFS false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/deploy/systemd/run-severino*
      # The companion's worker modules use Python 3.15's lazy import, so the
      # pinned interpreter is chosen before anything runs, not after.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15'
      # The host's uv action installs the version mise.lock pins, through mise.
      # Windows has no mise here, so the same pinned version comes from PyPI.
      - name: Install uv on Windows
        if: runner.os == 'Windows'
        run: python -m pip install --disable-pip-version-check "uv==0.13.4"
      - name: Install uv on Linux
        if: runner.os != 'Windows'
        uses: ./.github/actions/uv
        with:
          host: .
      - name: Verify companion
        run: uv run --locked --no-default-groups python -m unittest discover -s gamedev/tests -v
      - name: Verify CLI
        run: uv run --locked --no-default-groups python -m gamedev --help
      - name: Verify live workspace
        run: uv run --locked --no-default-groups python -m tools.windows_hq.check
      - name: Build and verify the full Windows showcase
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./deploy/windows/Build-GameDevShowcase.ps1 -Check
